name: Render Anti-Sleep Keep-Alive

on:
  schedule:
    # Har 14 daqiqada ishga tushadi (Render bepul rejimida 15 daqiqada uxlab qolmasligi uchun)
    - cron: '*/14 * * * *'
  workflow_dispatch: # GitHub interfeysidan qo'lda ishga tushirish imkoni

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Render App
        run: |
          # Agar GitHub Secrets da RENDER_APP_URL berilmagan bo'lsa, standart nom ishlatiladi
          URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$URL" ]; then
            URL="https://qurilish-boshqaruv-tizimi.onrender.com"
          fi
          
          # Oxiridagi / belgisini olib tashlash
          URL="${URL%/}"
          TARGET_URL="${URL}/api/health"

          echo "Pinging: $TARGET_URL"
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" "$TARGET_URL" || echo "failed")

          echo "HTTP Status: $HTTP_STATUS"
          if [ -f response.json ]; then
            echo "Response: $(cat response.json)"
          fi

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Render ilovasi muvaffaqiyatli uyg'oq tutildi!"
          else
            echo "⚠️ Ogohlantirish: Status $HTTP_STATUS"
          fi
