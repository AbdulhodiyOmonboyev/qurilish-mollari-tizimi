services:
  # 1. Next.js Web Dashboard & Onlayn Do'kon
  - type: web
    name: qurilish-boshqaruv-tizimi
    runtime: node
    plan: free
    region: frankfurt # Yevropa/O'zbekistonga eng yaqin
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js && npm run build
    startCommand: npm run start:all
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qurilish-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: NODE_VERSION
        value: 20

databases:
  # 2. Render Managed PostgreSQL Database
  - name: qurilish-db
    databaseName: qurilish_db
    user: postgres
    plan: free
    region: frankfurt
